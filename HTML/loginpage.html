<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin:0px;
        }

        #login-container{
            background-color: antiquewhite;
            width: 250px;
            padding: 30px;
            border-radius: 8px;
        }
        .login-image img{
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <main>
        <section id="login-container">
            <h1>Login</h1>
            <div class="login-image">
                <img src="css/images/default-user-image.png">
            </div>
            <form>
                <div>
                    <label>E-mail</label>
                    <input type="email" name="email">
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" name="password">
                </div>
                <div>
                    <input type="submit" value="Login">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
